<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="chat-header">
        <h1>Smart Assistant</h1>
        <button id="logout-btn" type="button">Odjavi se</button>
    </header>
    <div id="chat">
        <p class="poruka bot"><strong>Bot:</strong> Zdravo! Kako mogu da ti pomognem?</p>
    </div>
    <div>
        <input type="text" id="poruka" placeholder="Unesi pitanje...">
        <button id="posalji">Pošalji</button>
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </div>
    <script>
        document.getElementById("logout-btn").addEventListener("click", async function () {
            try {
                const odgovor = await fetch("/logout", {
                    method: "POST"
                });
                if (odgovor.ok) {
                    window.location.href ="/login";
                } else {
                    alert("Odjava nije uspela. Pokušajte ponovo.")
                }
            } catch (greška) {
                alert("Došlo je do greške prilikom odjave.")
            }
        });
    </script>
</body>
</html>
